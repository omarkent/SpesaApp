name: Build SpyDean Camera APK

on:
  push:
    branches:
      - spydean-viewer-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch Camera source blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/336f0570e37910350b942d7aad6a52517b67cb59" \
            | python -c "import sys,json,base64; d=json.load(sys.stdin); open('camera.zip','wb').write(base64.b64decode(d['content']))"
          unzip -q camera.zip
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Camera APK
        working-directory: SpyDean-Camera
        run: gradle :app:assembleDebug
      - name: Prepare APK
        run: cp SpyDean-Camera/app/build/outputs/apk/debug/app-debug.apk SpyDean-Camera-J1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpyDean-Camera-J1
          path: SpyDean-Camera-J1.apk

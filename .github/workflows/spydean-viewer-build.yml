name: Build SpyDean Viewer APK

on:
  push:
    branches:
      - spydean-viewer-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: spydean-viewer
        run: gradle :app:assembleDebug
      - name: Prepare APK
        run: cp spydean-viewer/app/build/outputs/apk/debug/app-debug.apk SpyDean-Viewer-S25.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpyDean-Viewer-S25
          path: SpyDean-Viewer-S25.apk

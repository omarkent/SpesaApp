<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spesa</title>
<style>
:root{--bg:#0b0d10;--p:#13171c;--t:#f4f6f8;--m:#8e98a6;--l:#252c35;--a:#7c5cff;--g:#33d17a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0c0f,#0f1217 45%,#0a0c0f);color:var(--t);font:16px system-ui,sans-serif;min-height:100vh;padding-bottom:92px}.w{max-width:720px;margin:auto;padding:20px 16px 110px}h1{font-size:30px;margin:4px 0}.sub{color:var(--m);font-size:13px;margin-bottom:20px}.card{background:var(--p);border:1px solid var(--l);border-radius:22px}.addbox{padding:12px;display:grid;grid-template-columns:1fr 58px;gap:10px;margin-bottom:14px}.addbox input{background:#0e1115;border:1px solid var(--l);color:white;border-radius:16px;padding:15px}.add{border:0;border-radius:16px;background:linear-gradient(135deg,#7557ff,#9b59ff);color:white;font-size:25px;font-weight:800}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.chip{white-space:nowrap;border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:999px;padding:9px 13px}.chip.on{color:white;background:#211b37;border-color:#5f4bd1}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:30px 1fr 40px;gap:12px;align-items:center;padding:14px}.ck{width:28px;height:28px;border-radius:10px;border:2px solid #3b4654;background:#0d1014}.done .ck{background:var(--g);border-color:var(--g)}.done .nm{text-decoration:line-through;color:#798290}.nm{font-weight:750}.meta{color:var(--m);font-size:12px;margin-top:4px}.dots{border:0;background:transparent;color:#aaa;font-size:25px}.empty{text-align:center;color:var(--m);padding:45px 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.store{padding:17px}.store b{display:block;font-size:18px}.store small{color:var(--m)}.count{float:right;background:#242a33;border-radius:999px;padding:3px 8px}.danger{width:100%;margin-top:18px;padding:14px;border-radius:15px;border:1px solid #5e2630;background:#2a1116;color:#ff9ea7;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;background:#0b0d10e8;border-top:1px solid var(--l);padding:10px 14px 14px;display:flex;gap:10px}.nav{flex:1;border:0;border-radius:15px;background:#141820;color:#8994a2;padding:13px;font-weight:800}.nav.on{background:#231e39;color:white}.hide{display:none!important}dialog{border:1px solid var(--l);border-radius:22px;background:#11151a;color:white;padding:18px;width:min(92vw,430px)}dialog::backdrop{background:#000a}select{width:100%;background:#0b0e12;color:white;border:1px solid var(--l);border-radius:14px;padding:13px}.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:800}.save{background:var(--a);color:white}.del{background:#2a1116;color:#ff95a0}.cancel{background:#1d2229;color:#bec6d0}
</style></head><body><div class="w"><h1>Spesa</h1><div class="sub" id="sub">Lista vuota</div><section id="lv"><div class="card addbox"><input id="inp" placeholder="Aggiungi un prodotto…" autocomplete="off"><button class="add" id="add">+</button></div><div class="filters" id="filters"></div><div class="list" id="list"></div></section><section id="sv" class="hide"><div class="grid" id="grid"></div><button class="danger" id="clear">Elimina tutta la lista</button></section></div><nav><button class="nav on" data-tab="list">🛒 Lista</button><button class="nav" data-tab="stores">🏪 Negozi</button></nav><dialog id="dlg"><h3 id="title">Prodotto</h3><select id="sel"></select><div class="row"><button class="del" id="del">Elimina</button><button class="save" id="save">Salva</button></div><div class="row"><button class="cancel" id="cancel">Annulla</button></div></dialog>
<script>
const S=["Tutti","Senza negozio","Iper","MD","Aldi","Action","Iperal"];let d=JSON.parse(localStorage.getItem("spesa-v3")||"[]"),f="Tutti",eid=null;const $=q=>document.querySelector(q),dlg=$("#dlg");function persist(){localStorage.setItem("spesa-v3",JSON.stringify(d));render()}function add(){let i=$("#inp"),n=i.value.trim();if(!n)return;d.unshift({id:Date.now()+"-"+Math.random(),name:n,done:false,store:"Senza negozio"});i.value="";persist();i.focus()}function render(){let fs=$("#filters");fs.innerHTML="";S.forEach(s=>{let b=document.createElement("button");b.className="chip"+(f===s?" on":"");b.textContent=s;b.onclick=()=>{f=s;render()};fs.appendChild(b)});let v=f==="Tutti"?d:d.filter(x=>x.store===f),l=$("#list");l.innerHTML="";$("#sub").textContent=d.length?d.filter(x=>!x.done).length+" da prendere · "+d.length+" totali":"Lista vuota";if(!v.length)l.innerHTML='<div class="card empty">🛍️<br><br><b>'+(d.length?"Niente qui":"Nessun prodotto")+'</b><br><small>'+(d.length?"Cambia filtro.":"Aggiungi il primo prodotto sopra.")+'</small></div>';v.forEach(x=>{let e=document.createElement("div");e.className="card item"+(x.done?" done":"");e.innerHTML='<button class="ck"></button><div><div class="nm"></div><div class="meta"></div></div><button class="dots">⋮</button>';e.querySelector(".nm").textContent=x.name;e.querySelector(".meta").textContent=x.store;e.querySelector(".ck").onclick=()=>{x.done=!x.done;persist()};e.querySelector(".dots").onclick=()=>edit(x.id);l.appendChild(e)});stores()}function stores(){let g=$("#grid");g.innerHTML="";S.slice(1).forEach(s=>{let a=d.filter(x=>x.store===s),c=document.createElement("div");c.className="card store";c.innerHTML='<span class="count">'+a.length+'</span><b>'+s+'</b><small>'+a.filter(x=>!x.done).length+' da prendere</small>';c.onclick=()=>{f=s;tab("list");render()};g.appendChild(c)})}function edit(id){eid=id;let x=d.find(y=>y.id===id);$("#title").textContent=x.name;let s=$("#sel");s.innerHTML="";S.slice(1).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n;o.selected=n===x.store;s.appendChild(o)});dlg.showModal()}function tab(t){$("#lv").classList.toggle("hide",t!=="list");$("#sv").classList.toggle("hide",t!=="stores");document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.tab===t))}$("#add").onclick=add;$("#inp").onkeydown=e=>{if(e.key==="Enter")add()};$("#save").onclick=()=>{let x=d.find(y=>y.id===eid);if(x)x.store=$("#sel").value;dlg.close();persist()};$("#del").onclick=()=>{d=d.filter(x=>x.id!==eid);dlg.close();persist()};$("#cancel").onclick=()=>dlg.close();$("#clear").onclick=()=>{if(confirm("Eliminare tutta la lista?")){d=[];f="Tutti";persist()}};document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>tab(b.dataset.tab));render();
</script></body></html>
